<div class="modal fade v4-sheet" id="v4BuscaModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="v4BuscaTitulo" aria-hidden="true">
    <div class="modal-dialog v4-busca-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="dialog-title" id="v4BuscaTitulo">Buscar</h2>
                <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="search-box">
                <div class="v4-busca-campo">
                    <input class="search search-input" id="v4BuscaInput" type="search" placeholder="Time, campeonato ou país" aria-label="Buscar jogos" autocomplete="off">
                    <button type="button" class="v4-busca-limpar" id="v4BuscaLimpar" aria-label="Limpar busca" hidden>&times;</button>
                </div>
            </div>

            <div class="search-results" id="v4BuscaResultados" aria-live="polite">
                <p class="v4-busca-dica">Digite pelo menos 2 letras para buscar.</p>
            </div>
        </div>
    </div>
</div>
