<!--
  TEMA BET24 (site11) - REFERENCIA v4
  Arquivo: 09 - Modal Cadastro (.v4-cadastro-dialog)
  Origem: pages/home.html linhas 298-375
  Obs.: Dialogo de 560px, campos em 2 colunas (.v4-cadastro-2 -> 1 coluna em <=560px), hCaptcha, botao .account-submit e rodapes legais. Action /v4/cadastro do v4 - trocar pelo cadastro do sistema atual.

  Recorte REAL do site antigo bet24hs.site/v4 (classes e estrutura preservadas).
  Os links /v4/..., as imagens do CDN e os ids/onclick do backend v4 sao apenas
  referencia: no tema novo troque por rotas Twig e dados do sistema atual.
-->
            <div class="modal fade v4-sheet" id="v4CadastroModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="v4CadastroTitulo" aria-hidden="true">
    <div class="modal-dialog v4-cadastro-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="dialog-title" id="v4CadastroTitulo">Criar conta</h2>
                <button type="button" class="close" data-dismiss="modal" aria-label="Fechar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-body">
                <form class="account-form v4-cadastro-form" autocomplete="off" id="frmCadastro" method="POST" action="/v4/cadastro" novalidate>
                    <p class="account-hint">Leva menos de um minuto. Depois do cadastro você já pode depositar e apostar.</p>

                    
                        <label class="account-field">
                            <span class="account-label">Nome completo</span>
                            <input type="text" id="nome" name="nome" required class="account-input" autocomplete="name">
                        </label>

                        <div class="v4-cadastro-2">
                            <label class="account-field">
                                <span class="account-label">CPF</span>
                                <input type="text" id="cpf" name="cpf" required class="account-input cpf" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off">
                            </label>

                            <label class="account-field">
                                <span class="account-label">Celular</span>
                                <input type="text" id="celular" name="celular" required class="account-input phone" inputmode="tel" placeholder="(00) 0 0000-0000" autocomplete="tel">
                            </label>
                        </div>

                    
                    <div class="v4-cadastro-2">
                        <label class="account-field">
                            <span class="account-label">Usuário</span>
                            <input type="text" id="usuario" name="usuario" required class="account-input" autocomplete="off" autocapitalize="off">
                        </label>

                        <label class="account-field">
                            <span class="account-label">Email</span>
                            <input type="email" id="email" name="email" required class="account-input" autocomplete="email">
                        </label>
                    </div>

                    <div class="v4-cadastro-2">
                        <label class="account-field">
                            <span class="account-label">Senha</span>
                            <input type="password" id="senha" name="senha" required minlength="6" class="account-input" autocomplete="new-password">
                        </label>

                        <label class="account-field">
                            <span class="account-label">Confirmar senha</span>
                            <input type="password" id="csenha" name="csenha" required minlength="6" class="account-input" autocomplete="new-password">
                        </label>
                    </div>

                    <p class="v4-cadastro-erro errorTxt" id="v4CadastroErro" role="alert" hidden></p>

                    <!-- Mesma chave do hCaptcha usada no hub. O script é carregado quando o modal abre. -->
                    <div class="h-captcha v4-cadastro-captcha" data-sitekey="500e2c08-0ca9-4115-8604-da1f28727c05"></div>

                    <button name="cadastro" type="submit" class="account-submit" id="v4CadastroBotao">Cadastrar-se</button>

                    <p class="v4-cadastro-rodape">
                        Ao se cadastrar você aceita as <a href="/v4/paginas/regras" target="_blank" rel="noopener">regras</a>
                        e a <a href="/v4/paginas/politica-privacidade" target="_blank" rel="noopener">política de privacidade</a>.
                    </p>

                    <p class="v4-cadastro-rodape">
                        Já tem conta? <a href="/v4/?entrar=1" data-v4-entrar>Entrar</a>
                        · <a href="/v4/?recuperar=1" data-v4-recuperar>Esqueceu sua senha?</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
