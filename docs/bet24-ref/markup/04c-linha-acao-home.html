<!--
  TEMA BET24 (site11) - REFERENCIA v4
  Arquivo: 04c - Linha compacta da home ("Junte-se a acao") - .action-row
  Origem: template JS em js_v4-home.js (funcoes linhaAcao() 181-192, times() 151-155,
          tags() 166-178, odds() 143-149) + classes reais em css_v4_app.css.

  Diferenca para .match-row:
    - .action-row e o cartao da secao principal da home (lista solta, sem campeonato)
    - .action-when mostra horario + dia
    - .action-teams traz os times E o nome do campeonato com bandeira (.action-league)
    - o "+N mercados" fica dentro de .action-league como .action-more
    - nao tem a coluna final de 52px do .match-row

  Grid: 64px | minmax(0,1fr) | minmax(300px,420px)  (<=960px: 52px | 1fr e odds na linha toda)

  Estas linhas sao carregadas em lotes de 20 por v4-home.js a partir de
  /router?path=v4.home&bloco=jogos. O JSON de cada jogo tem:
    id, cid, cn (campeonato), bd (bandeira), h (hora), dm (data), dia,
    busca, casa, fora, ec/ef (escudos), mais [url, qtd], ca, pa, st (stats), x (tem empate),
    o [[taxaId, "2,11"], ...]
-->

<!-- =====================================================================
     1) Linha com selos CA + PA, estatisticas e "+950" (caso mais completo)
     ===================================================================== -->
